[package]
name = "rs-lvgl-embedscope-example"
version = "0.1.0"
edition = "2021"
publish = false

# Independent registry consumer. The application supplies its own tree so
# EmbedScope need not select a native LVGL provider.
[workspace]

[features]
default = []
embedscope = ["dep:escope-protocol", "dep:escope-agent", "dep:escope-lvgl", "dep:serde_json", "rs_lvgl_ui/diagnostics"]

[dependencies]
rs_lvgl = { version = "0.8.0", default-features = false, features = ["alloc", "unsafe_no_autoinit"] }
rs_lvgl_ui = { version = "0.8.0", default-features = false, features = ["alloc", "no-autoinit", "font-montserrat-16", "widget-slider"] }
escope-protocol = { version = "=0.6.0", optional = true }
escope-agent = { version = "=0.6.0", optional = true }
escope-lvgl = { version = "=0.6.0", default-features = false, optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
escope-host = "=0.6.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }
