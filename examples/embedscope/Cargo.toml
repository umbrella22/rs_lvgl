[package]
name = "rs-lvgl-embedscope-example"
version = "0.1.0"
edition = "2021"
publish = false

# An independent application using one published native provider, including
# the provider selected by escope-lvgl/native. No workspace defaults change.
[workspace]

[features]
default = []
embedscope = ["dep:escope-protocol", "dep:escope-agent", "dep:escope-lvgl", "rs_lvgl_ui/diagnostics"]

[dependencies]
rs_lvgl = { version = "=0.3.1", default-features = false, features = ["alloc", "unsafe_no_autoinit"] }
rs_lvgl_ui = { version = "=0.3.1", default-features = false, features = ["alloc", "no-autoinit"] }
escope-protocol = { version = "=0.1.0", optional = true }
escope-agent = { version = "=0.1.0", optional = true }
escope-lvgl = { version = "=0.1.0", features = ["native"], optional = true }

[dev-dependencies]
escope-host = "=0.1.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }
