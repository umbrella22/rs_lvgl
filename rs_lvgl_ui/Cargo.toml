[package]
name = "rs_lvgl_ui"
description = "Declarative, typed Rust UI layer for LVGL 9.6 with keyed reconciliation."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/umbrella22/rs_lvgl"
categories = ["embedded", "gui", "no-std"]
keywords = ["rs_lvgl", "embedded", "gui", "ui"]
publish = ["crates-io"]
readme = "README.md"

[dependencies]
rs_lvgl = { version = "0.1.0", path = "../rs_lvgl", default-features = false }
# rs_lvgl_ui always selects LVGL widgets and fonts through its own features, so
# LVGL only compiles what they enable (see "Choosing widgets" in README.md).
rs_lvgl_sys = { version = "0.1.0", path = "../rs_lvgl_sys", features = ["minimal-config"] }
cstr_core = { version = "0.2.6", default-features = false, features = ["alloc"] }
cty = "0.2.2"

[features]
# `alloc` is the only capability required on bare-metal targets. It enables the
# allocator-aware parts of the `rs_lvgl` crate; `rs_lvgl_ui` itself always requires
# `alloc`.
default = ["alloc", "components", "widgets-all", "fonts-vendored"]
alloc = ["rs_lvgl/alloc"]
# Composite components (`rs_lvgl_ui::components`): lists, panels, stack
# navigation, dialogs and toasts built from plain nodes.
components = []
input-keypad = ["rs_lvgl/input-keypad"]
input-gridnav = ["input-keypad", "rs_lvgl_sys/gridnav"]
# Host acceptance harness; requires the dedicated BUILTIN allocator config.
# This does not select an allocator or change production defaults.
leak-check = [
    "alloc", "components", "widgets-all", "fonts-vendored", "input-gridnav",
    "widget-qrcode", "widget-barcode", "widget-gif", "widget-lottie",
    "widget-ime-pinyin", "font-cjk-16",
]

# Widgets. Obj, row, column, grid, label, button and custom nodes are always
# available; every other `Node` constructor needs its `widget-*` feature.
# LVGL compiles only the enabled widgets (plus the ones they build on), so
# disabling unused ones shrinks the firmware. `widgets-all` also keeps the
# LVGL widgets that have no node (list, menu, win) for raw `rs_lvgl_sys`
# use; with it disabled, enable them through `rs_lvgl_sys/widget-*`.
widgets-all = [
    "widget-animimage",
    "widget-arc",
    "widget-arclabel",
    "widget-bar",
    "widget-buttonmatrix",
    "widget-calendar",
    "widget-chart",
    "widget-checkbox",
    "widget-dropdown",
    "widget-image",
    "widget-imagebutton",
    "widget-keyboard",
    "widget-led",
    "widget-line",
    "widget-msgbox",
    "widget-roller",
    "widget-scale",
    "widget-slider",
    "widget-span",
    "widget-spinbox",
    "widget-spinner",
    "widget-switch",
    "widget-table",
    "widget-tabview",
    "widget-textarea",
    "widget-tileview",
    "widget-canvas",
    "rs_lvgl_sys/widget-list",
    "rs_lvgl_sys/widget-menu",
    "rs_lvgl_sys/widget-win",
]
widget-animimage = ["rs_lvgl_sys/widget-animimage"]
widget-arc = ["rs_lvgl_sys/widget-arc"]
widget-arclabel = ["rs_lvgl_sys/widget-arclabel"]
widget-bar = ["rs_lvgl_sys/widget-bar"]
widget-buttonmatrix = ["rs_lvgl_sys/widget-buttonmatrix"]
widget-canvas = ["rs_lvgl_sys/widget-canvas"]
widget-calendar = ["rs_lvgl_sys/widget-calendar"]
widget-chart = ["rs_lvgl_sys/widget-chart"]
widget-checkbox = ["rs_lvgl_sys/widget-checkbox"]
widget-dropdown = ["rs_lvgl_sys/widget-dropdown"]
widget-image = ["rs_lvgl_sys/widget-image"]
widget-imagebutton = ["rs_lvgl_sys/widget-imagebutton"]
widget-keyboard = ["rs_lvgl_sys/widget-keyboard"]
widget-led = ["rs_lvgl_sys/widget-led"]
widget-line = ["rs_lvgl_sys/widget-line"]
widget-msgbox = ["rs_lvgl_sys/widget-msgbox"]
widget-roller = ["rs_lvgl_sys/widget-roller"]
widget-scale = ["rs_lvgl_sys/widget-scale"]
widget-slider = ["rs_lvgl_sys/widget-slider"]
widget-span = ["rs_lvgl_sys/widget-span"]
widget-spinbox = ["rs_lvgl_sys/widget-spinbox"]
widget-spinner = ["rs_lvgl_sys/widget-spinner"]
widget-switch = ["rs_lvgl_sys/widget-switch"]
widget-table = ["rs_lvgl_sys/widget-table"]
widget-tabview = ["rs_lvgl_sys/widget-tabview"]
widget-textarea = ["rs_lvgl_sys/widget-textarea"]
widget-tileview = ["rs_lvgl_sys/widget-tileview"]

# Optional extensions are separate from widgets-all to preserve defaults.
widget-qrcode = ["rs_lvgl_sys/widget-qrcode"]
widget-barcode = ["rs_lvgl_sys/widget-barcode"]
widget-gif = ["rs_lvgl_sys/widget-gif"]
widget-lottie = ["rs_lvgl_sys/widget-lottie"]
widget-ime-pinyin = ["rs_lvgl_sys/widget-ime-pinyin", "widget-keyboard"]
font-cjk-14 = ["rs_lvgl_sys/font-cjk-14"]
font-cjk-16 = ["rs_lvgl_sys/font-cjk-16"]

# Built-in Montserrat fonts. 14 is LVGL's default font and always available;
# `Font::montserrat_<size>()` exists for every enabled size. `fonts-vendored`
# is the set the vendored lv_conf.h enabled before fonts became selectable.
fonts-vendored = [
    "font-montserrat-12",
    "font-montserrat-16",
    "font-montserrat-28",
    "font-montserrat-48",
]
font-montserrat-8 = ["rs_lvgl_sys/font-montserrat-8"]
font-montserrat-10 = ["rs_lvgl_sys/font-montserrat-10"]
font-montserrat-12 = ["rs_lvgl_sys/font-montserrat-12"]
font-montserrat-16 = ["rs_lvgl_sys/font-montserrat-16"]
font-montserrat-18 = ["rs_lvgl_sys/font-montserrat-18"]
font-montserrat-20 = ["rs_lvgl_sys/font-montserrat-20"]
font-montserrat-22 = ["rs_lvgl_sys/font-montserrat-22"]
font-montserrat-24 = ["rs_lvgl_sys/font-montserrat-24"]
font-montserrat-26 = ["rs_lvgl_sys/font-montserrat-26"]
font-montserrat-28 = ["rs_lvgl_sys/font-montserrat-28"]
font-montserrat-30 = ["rs_lvgl_sys/font-montserrat-30"]
font-montserrat-32 = ["rs_lvgl_sys/font-montserrat-32"]
font-montserrat-34 = ["rs_lvgl_sys/font-montserrat-34"]
font-montserrat-36 = ["rs_lvgl_sys/font-montserrat-36"]
font-montserrat-38 = ["rs_lvgl_sys/font-montserrat-38"]
font-montserrat-40 = ["rs_lvgl_sys/font-montserrat-40"]
font-montserrat-42 = ["rs_lvgl_sys/font-montserrat-42"]
font-montserrat-44 = ["rs_lvgl_sys/font-montserrat-44"]
font-montserrat-46 = ["rs_lvgl_sys/font-montserrat-46"]
font-montserrat-48 = ["rs_lvgl_sys/font-montserrat-48"]
# Host-only: enables the gallery. The gallery uses LVGL's own SDL2 backend,
# which drives SDL from C. It deliberately does not depend on the Rust `sdl2`
# bindings: Homebrew's `sdl2` is now `sdl2-compat` (SDL3-based) and leaks SDL3
# event codes those bindings cannot decode.
simulator = ["rs_lvgl/sdl"]
rust_timer = ["rs_lvgl/rust_timer"]
# Host gallery of the optional capabilities; no effect on default builds.
capability-gallery = [
    "simulator", "components", "input-gridnav", "widget-canvas",
    "widget-qrcode", "widget-barcode", "widget-gif", "widget-lottie",
    "widget-ime-pinyin", "widget-textarea", "font-cjk-16",
]
# Complete host component studio. This never changes library defaults.
showcase = [
    "alloc", "widgets-all", "fonts-vendored", "capability-gallery",
    "font-montserrat-20", "font-montserrat-32",
]
# Bare-metal platforms that must call `rs_lvgl::init()` themselves instead of
# relying on the `ctor`-based automatic initialization. This forwards a global
# `rs_lvgl` switch, so it is opt-in and never enabled by `alloc`.
no-autoinit = ["rs_lvgl/unsafe_no_autoinit"]
# Reserved for `core::error::Error` support on nightly toolchains.
nightly = []

# Examples and tests list the widget features they use, so builds with a
# reduced widget set skip them instead of failing.
[[example]]
name = "studio"
required-features = ["showcase"]

[[example]]
name = "input"
required-features = ["simulator", "input-keypad"]

[[example]]
name = "capabilities"
required-features = [
    "simulator", "components", "input-gridnav", "widget-canvas",
    "widget-qrcode", "widget-barcode", "widget-gif", "widget-lottie",
    "widget-ime-pinyin", "widget-textarea", "font-cjk-16",
]

[[example]]
name = "settings"
required-features = ["widget-slider", "widget-switch"]

[[example]]
name = "gallery"
required-features = ["simulator", "widget-slider", "widget-switch"]

[[example]]
name = "widgets_demo"
required-features = [
    "simulator",
    "widget-arc", "widget-chart", "widget-checkbox", "widget-dropdown", "widget-image", "widget-keyboard",
    "widget-scale", "widget-slider", "widget-switch", "widget-tabview", "widget-textarea",
]

[[example]]
name = "components"
required-features = ["simulator", "components", "widget-switch"]

[[test]]
name = "leak_check"
required-features = ["leak-check"]

[[test]]
name = "input_focus"
required-features = ["input-keypad"]

[[test]]
name = "components"
required-features = ["components", "widget-switch"]

[[test]]
name = "foundations"
required-features = ["widget-keyboard", "widget-slider", "widget-switch", "widget-textarea"]

[[test]]
name = "reconcile"
required-features = [
    "widget-arc", "widget-chart", "widget-checkbox", "widget-dropdown", "widget-image", "widget-keyboard",
    "widget-scale", "widget-slider", "widget-switch", "widget-tabview", "widget-textarea",
]

[[test]]
name = "regressions"
required-features = ["widget-keyboard", "widget-slider", "widget-tabview", "widget-textarea", "font-montserrat-28"]

[[test]]
name = "widgets"
required-features = ["widget-buttonmatrix", "widget-led", "widget-line", "widget-roller", "widget-spinbox", "widget-spinner", "widget-table"]

[[test]]
name = "widgets2"
required-features = [
    "widget-animimage", "widget-arclabel", "widget-calendar", "widget-imagebutton",
    "widget-msgbox", "widget-span", "widget-tileview",
]

[[test]]
name = "canvas"
required-features = ["widget-canvas"]

[[test]]
name = "extensions"
required-features = ["widget-qrcode", "widget-barcode", "widget-gif", "widget-lottie", "widget-ime-pinyin", "font-cjk-14", "font-cjk-16"]

[[test]]
name = "focus_scopes"
required-features = ["input-gridnav", "components"]

[[example]]
name = "app"
path = "../examples/app.rs"
required-features = ["simulator", "widget-switch"]

[[example]]
name = "demo"
path = "../examples/demo.rs"
required-features = ["simulator", "widget-bar"]

[[example]]
name = "bar"
path = "../examples/bar.rs"
required-features = ["simulator", "widget-bar"]

[[example]]
name = "button_click"
path = "../examples/button_click.rs"
required-features = ["simulator"]

[[example]]
name = "scale"
path = "../examples/scale.rs"
required-features = ["simulator", "widget-scale", "widget-slider"]

[[example]]
name = "arc"
path = "../examples/arc.rs"
required-features = ["simulator", "widget-arc"]

[[example]]
name = "sdl"
path = "../examples/sdl.rs"
required-features = ["simulator"]

[[example]]
name = "sdl_demo"
path = "../examples/sdl_demo.rs"
required-features = ["simulator", "components", "widget-slider", "widget-switch", "widget-bar"]

[[example]]
name = "rust_timer"
path = "../examples/rust_timer.rs"
required-features = ["simulator", "rust_timer", "widget-bar"]

[[example]]
name = "animation"
path = "../examples/animation.rs"
required-features = ["simulator"]
