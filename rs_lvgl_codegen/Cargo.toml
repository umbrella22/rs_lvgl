[package]
name = "rs_lvgl_codegen"
version = "0.1.0"
description = "Code generation based on LVGL source code"
authors = ["Rafael Caricio <crates.lvgl@caric.io>", "Nia Espera <a5b6@riseup.net>"]
readme = "README.md"
edition = "2021"
license = "MIT"
repository = "https://github.com/umbrella22/rs_lvgl"

[dependencies]
regex = "1.11"
quote = "1.0.37"
lazy_static = "1.5.0"
proc-macro2 = "1.0.60"
Inflector = "0.11.4"
syn = { version = "2.0.18", features = ["full"]}
