[package]
name = "rs_lvgl"
description = "Rust widget, display, input and timer wrappers for the vendored LVGL 9.6 engine."
version = "0.1.0"
authors = ["Rafael Caricio <crates.lvgl@caric.io>", "Nia Espera <a5b6@riseup.net>"]
edition = "2021"
repository = "https://github.com/umbrella22/rs_lvgl"
license = "MIT"
readme = "../README.md"
categories = ["api-bindings", "embedded", "gui", "no-std"]
keywords = ["littlevgl", "rs_lvgl"]
build = "build.rs"

[dependencies]
rs_lvgl_sys = { version = "0.1.0", path = "../rs_lvgl_sys" }
cty = "0.2.2"
embedded-graphics = { version = "0.8.0", optional = true }
cstr_core = { version = "0.2.6", default-features = false, features = ["alloc"] }
bitflags = "2.6"
paste = "1.0"
ctor = "0.2"

[features]
default = ["embedded_graphics", "drivers"]

embedded_graphics = ["embedded-graphics"]
drivers = ["rs_lvgl_sys/drivers"]
sdl = ["rs_lvgl_sys/sdl"]
demo-widgets = ["rs_lvgl_sys/lv-demo-widgets"]
alloc = ["cstr_core/alloc"]
input-keypad = ["alloc"]
lvgl_alloc = ["alloc"]
use-vendored-config = ["rs_lvgl_sys/use-vendored-config"]
rust_timer = ["rs_lvgl_sys/rust_timer"]
custom_timer = ["rs_lvgl_sys/custom_timer"]
nightly = []
unsafe_no_autoinit = []
custom_allocator = []

[build-dependencies]
quote = "1.0"
proc-macro2 = "1.0"
rs_lvgl_codegen = { version = "0.1.0", path = "../rs_lvgl_codegen" }
rs_lvgl_sys = { version = "0.1.0", path = "../rs_lvgl_sys" }
