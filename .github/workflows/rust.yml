name: rs_lvgl

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rs-lvgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++ pkg-config libsdl2-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install sdl2 pkg-config
          echo "LIBRARY_PATH=$(pkg-config --variable=libdir sdl2)" >> "$GITHUB_ENV"
      - name: Resolve workspace dependencies
        run: cargo generate-lockfile
      - name: Build and test serially
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked -- --test-threads=1
      - name: Check examples and no_std configuration
        run: |
          cargo check -p rs_lvgl_ui --locked --examples --features showcase,rust_timer
          cargo check -p rs_lvgl --locked --no-default-features --lib
          cargo test -p rs_lvgl --locked --no-default-features --features lvgl_alloc,rust_timer -- --test-threads=1

  ui:
    name: Components and native studio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++ pkg-config libsdl2-dev xvfb xauth
      - name: Resolve workspace dependencies
        run: cargo generate-lockfile
      - name: Test all UI capabilities
        run: cargo test -p rs_lvgl_ui --locked --features showcase,font-cjk-14,rust_timer -- --test-threads=1
      - name: Test control, chart and custom property contracts
        run: cargo test -p rs_lvgl_ui --locked --features showcase,diagnostics,strict-properties,update-metrics --test control_depth --test chart_depth --test custom_props -- --test-threads=1
      - name: Test diagnostics without strict rejection
        run: cargo test -p rs_lvgl_ui --locked --features diagnostics -- --test-threads=1
      - name: Test diagnostics and strict property checking
        run: cargo test -p rs_lvgl_ui --locked --features diagnostics,strict-properties -- --test-threads=1
      - name: Test actual views and native SDL journeys
        run: xvfb-run -a python3 scripts/check-ui-examples.py --locked --artifacts target/ui-audit
      - name: Render the component studio
        run: python3 scripts/render-studio.py --locked --artifacts target/studio-audit
      - name: Check reduced configurations
        run: |
          cargo test -p rs_lvgl_ui --locked --no-default-features --features alloc,components -- --test-threads=1
          cargo check -p rs_lvgl_ui --locked --no-default-features --lib
          cargo check -p rs_lvgl_ui --locked --no-default-features --features alloc,no-autoinit --lib
          cargo check -p rs_lvgl_ui --locked --no-default-features --features alloc,diagnostics,strict-properties --lib
          for capability in widget-slider widget-textarea widget-chart input-keypad input-gridnav widget-canvas widget-qrcode widget-barcode widget-gif widget-lottie widget-ime-pinyin font-cjk-14 font-cjk-16; do
            cargo check -p rs_lvgl_ui --locked --no-default-features --features "alloc,$capability" --lib
          done
      - name: Keep images and native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rs-lvgl-studio
          path: |
            target/ui-audit/*.log
            target/ui-audit/*.json
            target/ui-audit/images/
            target/studio-audit/
          if-no-files-found: warn
          retention-days: 7

  ui-api:
    name: Public UI API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++ pkg-config
      - name: Resolve workspace dependencies
        run: cargo generate-lockfile
      - name: Check the public view API
        run: python3 scripts/check-ui-api.py --locked --artifacts target/ui-api-audit
      - name: Keep public API diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rs-lvgl-ui-api
          path: |
            target/ui-api-audit/*.log
            target/ui-api-audit/*.json
            target/ui-api-audit/*.rs
          if-no-files-found: warn
          retention-days: 7

  native-configuration:
    name: Native configuration and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++ pkg-config
      - name: Resolve workspace dependencies
        run: cargo generate-lockfile
      - name: Verify configuration and recovery
        run: python3 scripts/check-native-inputs.py --locked --artifacts target/native-input-audit
      - name: Keep configuration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rs-lvgl-native-configuration
          path: |
            target/native-input-audit/*.log
            target/native-input-audit/*.json
          if-no-files-found: warn
          retention-days: 7

  native-contracts:
    name: Layout, skills and packaged consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++ pkg-config
      - name: Resolve workspace dependencies
        run: cargo generate-lockfile
      - name: Verify independent layout capabilities
        run: python3 scripts/check-layout-config.py --locked --artifacts target/layout-config-audit
      - name: Verify installed skills and downstream examples
        run: python3 scripts/check-skills.py --locked --artifacts target/skill-audit
      - name: Verify unpacked UI packages and native consumer
        run: python3 scripts/check-ui-package.py --locked --artifacts target/ui-package-audit
      - name: Keep consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rs-lvgl-native-contracts
          path: |
            target/layout-config-audit/*.log
            target/layout-config-audit/*.json
            target/skill-audit/*.log
            target/skill-audit/*.json
            target/ui-package-audit/*.log
            target/ui-package-audit/*.json
          if-no-files-found: warn
          retention-days: 7

  heap-contracts:
    name: Rust and LVGL heap balance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++ pkg-config
      - name: Resolve workspace dependencies
        run: cargo generate-lockfile
      - name: Verify strict balance and leak sensitivity
        run: python3 scripts/check-ui-leaks.py --locked --artifacts target/leak-audit
      - name: Measure descriptor updates with owned and static text
        run: |
          python3 scripts/check-ui-costs.py --locked --artifacts target/update-costs/owned
          python3 scripts/check-ui-costs.py --locked --static-text --artifacts target/update-costs/static
      - name: Verify every representative workload and history case
        run: |
          python3 scripts/check-ui-workloads.py --locked --correctness-only --artifacts target/workload-audit
          python3 scripts/check-ui-history.py --locked --correctness-only --artifacts target/history-audit
      - name: Keep heap diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rs-lvgl-heap-contracts
          path: |
            target/leak-audit/*.log
            target/leak-audit/*.json
            target/update-costs/owned/*.log
            target/update-costs/owned/*.json
            target/update-costs/static/*.log
            target/update-costs/static/*.json
            target/workload-audit/*.log
            target/workload-audit/*.json
            target/history-audit/*.log
            target/history-audit/*.json
          if-no-files-found: warn
          retention-days: 7
